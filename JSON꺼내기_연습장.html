<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON 꺼내기 연습장</title>
<style>
:root{--bg:#fffaf2;--card:#fff;--ink:#1f2d3b;--sub:#5b6b7b;--navy:#173a5e;--blue:#1f6fc5;--orange:#f07f13;--line:#e3e9f0;--soft:#eef4fb;
 --good:#2f8f4e;--goodBg:#e9f7ee;--bad:#c0392b;--badBg:#fdecea;--key:#8a4fd0;--str:#2f7a45;--num:#c25b00;--bool:#1f6fc5;--code:#0f2235}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161d;--card:#1a212b;--ink:#e6edf5;--sub:#9aa8b8;--navy:#9cc6f0;--line:#2c3644;--soft:#1f2a38;--goodBg:#16301f;--badBg:#3a1d1a;--key:#c9a6f5;--str:#8fd6a5;--num:#ffb37a;--bool:#8fc1f5}}
:root[data-theme="dark"]{--bg:#11161d;--card:#1a212b;--ink:#e6edf5;--sub:#9aa8b8;--navy:#9cc6f0;--line:#2c3644;--soft:#1f2a38;--goodBg:#16301f;--badBg:#3a1d1a;--key:#c9a6f5;--str:#8fd6a5;--num:#ffb37a;--bool:#8fc1f5}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.55}
header{background:linear-gradient(120deg,#173a5e,#1f6fc5);color:#fff;padding:18px 24px 14px}
header .k{color:#ffd29b;font-weight:800;font-size:.8em}
header h1{margin:2px 0 4px;font-size:1.45em;letter-spacing:-.02em}
header p{margin:0;font-size:.88em;opacity:.95}
.stars{margin-top:8px;font-size:.85em;font-weight:700}
.tabs{display:flex;gap:8px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;z-index:5}
.tabs button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font:inherit;font-size:.82em;font-weight:700;cursor:pointer;min-height:42px}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .tabs button.on{color:#11161d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button.on{color:#11161d}}
.tabs button .c{font-size:.85em;opacity:.8;margin-left:4px}
.tabs button.all{border-color:var(--good)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;padding:20px 24px 60px;max-width:1500px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr;padding:14px 16px 50px}header,.tabs{padding-left:16px;padding-right:16px}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0}
.panel h2{margin:0 0 8px;font-size:1.05em;color:var(--navy)}
.intro{background:var(--soft);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:.92em}
.intro b{color:var(--navy)}
.intro code,.q code,.note code{font-family:"D2Coding",Consolas,monospace;background:rgba(127,127,127,.15);border-radius:5px;padding:1px 5px;font-size:.95em}
/* 서랍장(트리) */
.tree{font-family:"D2Coding",Consolas,"Noto Sans KR",monospace;font-size:.88em;max-height:68vh;overflow:auto;padding:4px 2px}
.tree ul{list-style:none;margin:0;padding-left:20px;border-left:2px dashed var(--line)}
.tree>ul{padding-left:0;border-left:0}
.tree li{margin:2px 0}
.tree .k{color:var(--key);font-weight:700}
.tree .ix{color:var(--sub);font-weight:700}
.tree .v{cursor:pointer;border-radius:5px;padding:0 4px}
.tree .v:hover,.tree .v.sel{background:#ffe2c2;outline:2px solid var(--orange)}
:root[data-theme="dark"] .tree .v:hover,:root[data-theme="dark"] .tree .v.sel{background:#4a3218}
.tree .s{color:var(--str)}.tree .n{color:var(--num)}.tree .b{color:var(--bool)}
.tree .tg{cursor:pointer;user-select:none;display:inline-block;width:20px;color:var(--orange);font-weight:800}
.tree .pv{color:var(--sub);font-size:.92em}
.tree .box{font-weight:800;color:var(--sub)}
.addr{margin-top:12px;background:var(--code);color:#e8f1fb;border-radius:12px;padding:10px 14px;font-family:"D2Coding",Consolas,monospace;font-size:.92em;min-height:48px;word-break:break-all}
.addr .lab{color:#9fc3e8;font-size:.82em;font-family:"Pretendard","Noto Sans KR",sans-serif;font-weight:700}
.addr .p{color:#ffd29b;font-weight:700}
/* 미션 */
.mlist{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.mlist button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-width:44px;min-height:40px;font:inherit;font-weight:800;cursor:pointer}
.mlist button.on{border-color:var(--orange);color:var(--orange)}
.mlist button.ok{background:var(--goodBg);border-color:var(--good);color:var(--good)}
.q{font-size:1.02em;font-weight:700;margin:4px 0 10px}
.q .no{display:inline-block;background:var(--orange);color:#fff;border-radius:8px;padding:0 10px;margin-right:8px;font-size:.85em}
.note{font-size:.86em;color:var(--sub);margin:6px 0}
textarea,input.expr{width:100%;font-family:"D2Coding",Consolas,"Noto Sans KR",monospace;font-size:16px;background:var(--code);color:#e8f1fb;border:2px solid #2b5a88;border-radius:12px;padding:12px 14px;line-height:1.55;outline:none;tab-size:2}
textarea:focus,input.expr:focus{border-color:var(--orange)}
textarea{min-height:170px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.row button{border:0;border-radius:12px;padding:0 16px;min-height:46px;font:inherit;font-size:.92em;font-weight:800;cursor:pointer}
.go{background:var(--orange);color:#fff}
.ghost{background:var(--soft);color:var(--navy)}
.res{margin-top:14px;border-radius:12px;padding:12px 14px;border:1px solid var(--line);font-size:.92em;display:none}
.res.on{display:block}
.res.ok{background:var(--goodBg);border-color:var(--good)}
.res.bad{background:var(--badBg);border-color:var(--bad)}
.res .t{font-weight:800;margin-bottom:6px}
.res.ok .t{color:var(--good)}.res.bad .t{color:var(--bad)}
.res pre{margin:4px 0;white-space:pre-wrap;word-break:break-all;font-family:"D2Coding",Consolas,"Noto Sans KR",monospace;font-size:.92em;background:rgba(127,127,127,.1);border-radius:8px;padding:8px 10px;max-height:240px;overflow:auto}
.res .cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:600px){.res .cmp{grid-template-columns:1fr}}
.res .cmp div>b{font-size:.82em;color:var(--sub)}
.hint{display:none;margin-top:10px;background:#fff4e5;border:1px solid #f0a24a;color:#7a4300;border-radius:12px;padding:10px 14px;font-size:.9em}
:root[data-theme="dark"] .hint{background:#3a2a14;color:#ffd29b}
.hint.on{display:block}
.hint pre{margin:6px 0 0;white-space:pre-wrap;font-family:"D2Coding",Consolas,monospace}
/* 이벤트 미니 화면 */
.screen{margin-top:12px;border:2px solid var(--line);border-radius:14px;overflow:hidden;display:none}
.screen.on{display:block}
.screen .bar{background:var(--soft);padding:6px 12px;font-size:.78em;color:var(--sub);font-weight:700}
.screen .btns{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.screen .btns button{border:2px solid var(--orange);background:var(--card);color:var(--orange);border-radius:99px;padding:6px 16px;min-height:44px;font:inherit;font-weight:800;cursor:pointer}
.screen .btns button.done{background:var(--orange);color:#fff}
.screen .out{padding:4px 14px 14px;min-height:60px;font-size:.95em}
.screen .out div{padding:3px 0;border-bottom:1px dashed var(--line)}
.screen .empty{color:var(--sub);font-size:.88em}
/* 퀴즈 */
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit;font-size:.95em;cursor:pointer;min-height:46px}
.opts button code{font-family:"D2Coding",Consolas,monospace}
.opts button.right{border-color:var(--good);background:var(--goodBg)}
.opts button.wrong{border-color:var(--bad);background:var(--badBg)}
.fin{text-align:center;padding:20px 10px}
.fin b{font-size:1.4em;color:var(--good)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tools button{border:1.5px solid var(--line);background:var(--card);color:var(--navy);border-radius:10px;padding:6px 12px;min-height:40px;font:inherit;font-size:.82em;font-weight:700;cursor:pointer}
#own{min-height:220px;background:var(--card);color:var(--ink);border-color:var(--line)}
.tiny{font-size:.78em;color:var(--sub)}
footer{text-align:center;font-size:.78em;color:var(--sub);padding:0 16px 30px}
</style></head><body>
<header>
 <div class="k">제주대 바이브코딩 초중급 · JSON 꺼내기 실습 데이</div>
 <h1>JSON 꺼내기 연습장 — 서랍장에서 하나씩 꺼내 보자</h1>
 <p>왼쪽 서랍장(JSON)을 눌러 보고, 오른쪽 미션을 풀어요. 맞으면 ✓ 가 쌓입니다. 코드는 한두 줄이면 충분해요.</p>
 <div class="stars" id="stars"></div>
</header>
<nav class="tabs" id="tabs"></nav>
<main>
 <section class="panel">
  <h2 id="treeTitle">서랍장 보기 — data</h2>
  <div class="note" id="treeNote">▶ 를 누르면 서랍이 열려요. 값(글자 · 숫자)을 누르면 그 자리의 <b>주소</b>가 아래에 나와요.</div>
  <div class="tree" id="tree"></div>
  <div class="addr" id="addr"><span class="lab">주소 — 값을 하나 눌러 보세요</span></div>
  <div class="tools" id="treeTools"></div>
 </section>
 <section class="panel" id="mission"></section>
</main>
<footer>관광지 목록은 강의용 근사값입니다 · 날씨 예시는 연습용으로 줄여 재구성한 Open-Meteo 응답 모양입니다 · 진행 기록은 이 브라우저에만 저장돼요</footer>
<script>
// ───────── 데이터 ─────────
const SPOTS = {"version":2,"note":"강의용 관광지 목록(19곳) — 4일차 목록에 1일차 미리보기 장소를 합친 판입니다(4일차 파일을 덮어쓰세요). 좌표는 지도 표시용 근사값이고, 운영시간 · 요금 · 휴무는 바뀌므로 넣지 않았어요. 방문 전 공식 안내로 확인하세요.","areas":{"동쪽":[33.46,126.88],"서쪽":[33.36,126.3],"서귀포":[33.25,126.56],"제주시":[33.51,126.52]},"spots":[{"name":"성산일출봉","area":"동쪽","lat":33.4581,"lon":126.9425,"indoor":false,"desc":"바다 위로 솟은 분화구 오름"},{"name":"섭지코지","area":"동쪽","lat":33.424,"lon":126.9306,"indoor":false,"desc":"바닷가 산책길과 등대"},{"name":"아쿠아플라넷 제주","area":"동쪽","lat":33.433,"lon":126.9277,"indoor":true,"desc":"대형 아쿠아리움"},{"name":"만장굴","area":"동쪽","lat":33.5284,"lon":126.7714,"indoor":true,"desc":"용암동굴 — 비 영향이 적음"},{"name":"비자림","area":"동쪽","lat":33.4906,"lon":126.8102,"indoor":false,"desc":"비자나무 숲길"},{"name":"협재해수욕장","area":"서쪽","lat":33.394,"lon":126.2397,"indoor":false,"desc":"에메랄드빛 바다와 비양도"},{"name":"새별오름","area":"서쪽","lat":33.3657,"lon":126.3567,"indoor":false,"desc":"억새로 유명한 오름"},{"name":"오설록 티 뮤지엄","area":"서쪽","lat":33.3059,"lon":126.2894,"indoor":true,"desc":"녹차 박물관과 차밭"},{"name":"본태박물관","area":"서쪽","lat":33.303,"lon":126.395,"indoor":true,"desc":"건축과 전통 공예 전시"},{"name":"국립제주박물관","area":"제주시","lat":33.5139,"lon":126.5487,"indoor":true,"desc":"제주 역사 · 문화 전시"},{"name":"동문재래시장","area":"제주시","lat":33.5116,"lon":126.5262,"indoor":true,"desc":"지붕 있는 전통시장 먹거리"},{"name":"제주특별자치도 민속자연사박물관","area":"제주시","lat":33.5063,"lon":126.53,"indoor":true,"desc":"제주의 자연과 생활 전시"},{"name":"한라수목원","area":"제주시","lat":33.4697,"lon":126.493,"indoor":false,"desc":"도심 가까운 숲 산책"},{"name":"용두암","area":"제주시","lat":33.5164,"lon":126.4919,"indoor":false,"desc":"용머리 모양 바위 해안"},{"name":"천지연폭포","area":"서귀포","lat":33.2448,"lon":126.5594,"indoor":false,"desc":"서귀포 폭포 산책로"},{"name":"이중섭미술관","area":"서귀포","lat":33.2466,"lon":126.5652,"indoor":true,"desc":"서귀포 거리의 미술관"},{"name":"외돌개","area":"서귀포","lat":33.2398,"lon":126.545,"indoor":false,"desc":"바다에 홀로 선 바위와 올레길"},{"name":"쇠소깍","area":"서귀포","lat":33.2522,"lon":126.6237,"indoor":false,"desc":"민물과 바다가 만나는 계곡"},{"name":"중문 대포 주상절리대","area":"서귀포","lat":33.2378,"lon":126.425,"indoor":false,"desc":"육각 기둥 모양 해안 절벽"}]};
const WEATHER_SAMPLE = {"latitude":33.46,"longitude":126.88,"timezone":"Asia/Seoul",
 "daily_units":{"time":"iso8601","precipitation_probability_max":"%","temperature_2m_max":"°C"},
 "daily":{"time":["2026-10-30","2026-10-31"],"precipitation_probability_max":[20,80],"temperature_2m_max":[19.4,16.8]}};
const SNACK_SAMPLE = `{
  "반": "초중급 1반",
  "주문": [
    { "별명": "한라봉", "간식": "귤빵", "개수": 2, "매운맛": false },
    { "별명": "돌하르방", "간식": "오메기떡", "개수": 1, "매운맛": false },
    { "별명": "올레", "간식": "흑돼지 김밥", "개수": 3, "매운맛": true }
  ]
}`;
let WEATHER = JSON.parse(JSON.stringify(WEATHER_SAMPLE));
let OWN = JSON.parse(SNACK_SAMPLE);

// ───────── 단계 · 미션 ─────────
// type: pick(서랍 누르기) · expr(한 줄 주소) · code(여러 줄, show) · event(button + show) · choice(퀴즈)
const STAGES = [
 {id:1, name:'서랍 열어 보기', v:'data',
  intro:'<b>JSON = 서랍장.</b> <code>{ }</code> 는 <b>이름표</b> 붙은 서랍, <code>[ ]</code> 는 <b>번호</b> 붙은 서랍이에요. 오늘은 키보드 없이, 서랍을 열고 <b>값을 눌러</b> 보기만 해요.',
  ms:[
   {type:'pick', q:'맨 위 서랍 <code>version</code> 의 값을 눌러 보세요.', path:'data.version', hint:'맨 위에 보이는 version : 2 의 숫자 2 를 누르세요.'},
   {type:'pick', q:'장소 목록 <code>spots</code> 의 <b>첫 번째</b> 장소 이름을 눌러 보세요.', path:'data.spots[0].name', hint:'spots 의 ▶ → [0] 의 ▶ → name 옆 글자를 누르세요.'},
   {type:'pick', q:'<b>만장굴</b>의 설명(<code>desc</code>)을 찾아 눌러 보세요.', path:'data.spots[3].desc', hint:'spots 안에서 이름 미리보기에 만장굴이 보이는 서랍을 여세요.'},
   {type:'pick', q:'<b>서귀포</b> 대표 좌표의 첫 번째 숫자(위도)를 눌러 보세요.', path:'data.areas.서귀포[0]', hint:'areas ▶ → 서귀포 ▶ → [0] 의 숫자.'},
   {type:'pick', q:'<b>이중섭미술관</b>이 실내인지 알려 주는 값을 눌러 보세요.', path:'data.spots[15].indoor', hint:'indoor 는 실내면 true, 야외면 false 예요.'},
   {type:'pick', q:'<b>용두암</b>이 있는 지역(<code>area</code>)을 눌러 보세요. 주소 칸의 번호를 기억해 두세요!', path:'data.spots[13].area', hint:'spots 안에서 용두암 서랍을 찾으세요 — 몇 번 서랍인가요?'},
  ]},
 {id:2, name:'점(.)으로 꺼내기', v:'data',
  intro:'<b>점(.) = 이름표로 서랍 열기.</b> <code>data.areas</code> 는 “data 안의 areas 서랍”. 한 번 더 점을 찍으면 더 안쪽으로: <code>data.areas.동쪽</code>. 한글 이름표도 점으로 열 수 있어요.',
  ms:[
   {type:'expr', q:'<code>version</code> 값을 꺼내 보세요.', ans:'data.version', start:'data.', hint:'data 뒤에 점, 그리고 이름표 version'},
   {type:'expr', q:'안내 문구 <code>note</code> 를 꺼내 보세요.', ans:'data.note', start:'data.', hint:'data.note'},
   {type:'expr', q:'지역 서랍 <code>areas</code> 를 통째로 꺼내 보세요.', ans:'data.areas', start:'data.', hint:'서랍째 꺼내면 안쪽이 다 같이 나와요.'},
   {type:'expr', q:'<b>서귀포</b> 대표 좌표를 꺼내 보세요.', ans:'data.areas.서귀포', start:'data.areas.', hint:'data.areas 뒤에 점 하나 더 + 서귀포'},
   {type:'expr', q:'<b>제주시</b> 대표 좌표를 꺼내 보세요.', ans:'data.areas.제주시', start:'data.', hint:'바로 앞 문제와 같은 모양, 이름표만 바꿔요.'},
   {type:'expr', q:'함정! <code>data.Areas.동쪽</code> 을 먼저 그대로 넣어 보고, 무엇이 나오는지 본 다음 <b>바르게 고쳐</b> 동쪽 좌표를 꺼내세요.', ans:'data.areas.동쪽', start:'data.Areas.동쪽', hint:'이름표는 대문자 · 소문자까지 똑같아야 열려요. A → a'},
  ]},
 {id:3, name:'번호 [ ] 로 꺼내기', v:'data',
  intro:'<b>[번호] = 번호 서랍 열기.</b> 번호는 <b>0부터</b> 셉니다. 첫 번째 = <code>[0]</code>, 여섯 번째 = <code>[5]</code>. 몇 칸인지는 <code>.length</code>.',

// ───────── 상태 ─────────
const KEY = 'json-lab-v1';
let st = {done:{}, stage:1, idx:{}};
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.done) st = Object.assign(st, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
const mid = (sg, i) => sg.id + '-' + (i + 1);
const varData = v => v === 'j' ? WEATHER : (curStage().free ? OWN : SPOTS);
function curStage() { return STAGES.find(s => s.id === st.stage) || STAGES[0]; }

// ───────── 실행기 (Web Worker — 끝나지 않는 반복도 1.5초 뒤 멈춤) ─────────
const WSRC = `
let BTN = {}, OUT = [];
const fmt = v => typeof v === 'string' ? v : (v === undefined ? 'undefined' : JSON.stringify(v));
const show = (...a) => { if (OUT.length < 500) OUT.push(a.map(fmt).join(' ')); };
const button = (label, fn) => { BTN[String(label)] = fn; };
onmessage = e => {
  const m = e.data;
  if (m.click != null) { OUT = []; let err = null; try { BTN[m.click] && BTN[m.click](); } catch (er) { err = String(er && er.message || er); } postMessage({ id: m.id, out: OUT, err }); return; }
  BTN = {}; OUT = [];
  try {
    const body = m.mode === 'expr' ? 'return (' + m.code + '\\n)' : m.code;
    const f = new Function('data', 'j', 'show', 'button', body);
    const v = f(m.data, m.j, show, button);
    let value; if (m.mode === 'expr') value = v === undefined ? { __undef: 1 } : JSON.parse(JSON.stringify(v));
    let sims = null;
    if (m.sim) sims = m.sim.map(l => { OUT = []; let err = null; const has = !!BTN[l]; try { has && BTN[l](); } catch (er) { err = String(er.message); } return { l, has, out: OUT.slice(), err }; });
    const first = OUT; postMessage({ id: m.id, ok: true, value, out: m.sim ? [] : first, buttons: Object.keys(BTN), sims });
  } catch (er) { postMessage({ id: m.id, ok: false, err: String(er && er.message || er) }); }
};`;
let wURL = null; try { wURL = URL.createObjectURL(new Blob([WSRC], { type: 'text/javascript' })); } catch (e) {}

    if (missing.length) fail(r, `버튼 “${missing.join('”, “')}” 이(가) 없어요.`, '버튼 이름(따옴표 안 글자)이 정확히 같은지 확인하세요.');
    else show(r, '', `<div class="t">버튼이 생겼어요! 이제 미니 화면에서 <b>${m.need.map(esc).join(' · ')}</b> 을(를) 눌러 보세요.${m.counter ? ` (${m.counter}번)` : ''}</div>`);
    document.getElementById('btns').querySelectorAll('button').forEach(b => b.onclick = async () => {
      const l = b.dataset.l;
      const c = await runIn(play, { click: l });
      if (c.dead) { play = null; return fail(r, friendly('__TIMEOUT')); }
      const so = document.getElementById('sout');
      so.innerHTML = (c.out.length ? c.out.map(x => `<div>${esc(x)}</div>`).join('') : '<div class="empty">눌렀는데 아무것도 안 보여요 — 버튼 안에 show 가 있나요?</div>') + (c.err ? `<div style="color:var(--bad)">${esc(friendly(c.err))}</div>` : '');
      if (!m.need.includes(l) || missing.length) return;
      clickCount[l] = (clickCount[l] || 0) + 1;
      let good;
      if (m.counter) good = c.out.length === 1 && String(c.out[0]).trim() === String(clickCount[l]);
      else { const e = exp.sims.find(s => s.l === l); good = JSON.stringify(norm(c.out)) === JSON.stringify(norm(e.out)); }
      if (!good) { b.classList.remove('done'); const e = exp.sims && exp.sims.find(s => s.l === l);
        return fail(r, `“${l}” 을 눌렀는데 기대와 달라요.`, m.counter ? `${clickCount[l]}번째 누름 → ${clickCount[l]} 이 보여야 해요. 다시 실행해서 처음부터 눌러 보세요.` : `<div class="cmp"><div><b>내 화면</b><pre>${esc(c.out.join('\n'))}</pre></div><div><b>기대</b><pre>${esc(e.out.join('\n'))}</pre></div></div>`); }
      if (m.counter && clickCount[l] < m.counter) { show(r, '', `<div class="t">좋아요! ${clickCount[l]} — ${m.counter - clickCount[l]}번 더 눌러 보세요.</div>`); return; }
      b.classList.add('done'); okSet.add(l);
      const left = m.need.filter(x => !okSet.has(x));
      if (!left.length) pass(id, r, '누를 때마다 { } 안의 일이 다시 실행됐어요 — 이게 이벤트!');
      else show(r, '', `<div class="t">✓ “${esc(l)}” 통과! 남은 버튼: ${left.map(esc).join(' · ')}</div>`);
    });
  }
}
// ───────── 놀이터 ─────────
function drawFree(box, sg) {
  box.innerHTML = `<div class="intro">${sg.intro}</div>
   <div class="q">주소 한 줄 꺼내기</div><input class="expr" id="fx" spellcheck="false" value="${esc(st.fx || 'data.주문[0].간식')}"><div class="row"><button class="go" id="fxB">꺼내기</button></div><div class="res" id="fxR"></div>
   <div class="q" style="margin-top:18px">여러 줄 · 반복문 · 버튼</div><textarea id="fc" spellcheck="false">${esc(st.fc || "for (const o of data.주문) {\n  if (o.매운맛 === false) show(o.별명 + ' · ' + o.간식 + ' ' + o.개수 + '개')\n}\nbutton('매운맛만', () => {\n  for (const o of data.주문) {\n    if (o.매운맛) show(o.간식)\n  }\n})")}</textarea>
   <div class="row"><button class="go" id="fcB">실행</button></div>
   <div class="screen on" id="screen"><div class="bar">결과 · 미니 화면</div><div class="btns" id="btns"></div><div class="out" id="sout"><div class="empty">실행해 보세요</div></div></div>
   <div class="note" style="margin-top:12px">💡 아이디어 — 내 JSON 에 항목을 2개 더 넣고, 개수(숫자)를 모두 더해 보여 주기 · 분류 버튼 만들기 · 숫자가 가장 큰 항목 찾기.</div>`;
  const fx = document.getElementById('fx'), fc = document.getElementById('fc');
  fx.oninput = () => { st.fx = fx.value; save(); }; fc.oninput = () => { st.fc = fc.value; save(); };
  const runX = async () => { const w = makeWorker(); const r = await runIn(w, { code: fx.value, mode: 'expr', data: OWN, j: WEATHER }); if (w) w.terminate();
    const R = document.getElementById('fxR'); r.ok ? show(R, 'ok', `<pre>${esc(pretty(r.value))}</pre>`) : fail(R, friendly(r.err)); };
  fx.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); runX(); } };
  document.getElementById('fxB').onclick = runX;
  const runC = async () => { if (play) play.terminate(); play = makeWorker();
    const r = await runIn(play, { code: fc.value, mode: 'code', data: OWN, j: WEATHER }); if (r.dead) play = null;
    const so = document.getElementById('sout'), bt = document.getElementById('btns');
    if (!r.ok) { bt.innerHTML = ''; so.innerHTML = `<div style="color:var(--bad)">${esc(friendly(r.err))}</div>`; return; }
    so.innerHTML = r.out.length ? r.out.map(x => `<div>${esc(x)}</div>`).join('') : '<div class="empty">보여 준 것이 없어요</div>';
    bt.innerHTML = r.buttons.map(l => `<button data-l="${esc(l)}">${esc(l)}</button>`).join('');
    bt.querySelectorAll('button').forEach(b => b.onclick = async () => { const c = await runIn(play, { click: b.dataset.l }); if (c.dead) { play = null; so.innerHTML = esc(friendly('__TIMEOUT')); return; }
      so.innerHTML = (c.out.length ? c.out.map(x => `<div>${esc(x)}</div>`).join('') : '<div class="empty">보여 준 것이 없어요</div>') + (c.err ? `<div style="color:var(--bad)">${esc(friendly(c.err))}</div>` : ''); }); };
  fc.onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runC(); } if (e.key === 'Tab') { e.preventDefault(); const s = fc.selectionStart; fc.setRangeText('  ', s, fc.selectionEnd, 'end'); } };
  document.getElementById('fcB').onclick = runC;
}
function drawAll() { drawTabs(); drawTree(); drawMission(); }
if (st.own) { try { OWN = JSON.parse(st.own); } catch (e) {} }
OPEN = new Set([curStage().v]);
drawAll();
