<style>

:root[data-theme="dark"]{--bg:#11161d;--card:#1a212b;--ink:#e6edf5;--sub:#9aa8b8;--navy:#9cc6f0;--line:#2c3644;--soft:#1f2a38;--goodBg:#16301f;--badBg:#3a1d1a;--key:#c9a6f5;--str:#8fd6a5;--num:#ffb37a;--bool:#8fc1f5}
*{box-sizing:border-box}html,body{margin:0}

</style></head><body>
<header>
 <div class="k">제주대 바이브코딩 초중급 · 3일차 개인 과제(미션) · 30~40분</div>
 <h1>JSON 꺼내기 개인 과제 — 내 번호의 데이터에서 꺼내기</h1>
 <p>수강번호마다 데이터와 조건이 달라요. 옆 사람 답을 베끼면 틀려요 — 내 서랍장에서 꺼내세요!</p>
</header>
<div class="bar" id="bar" style="display:none"><span id="who"></span><span id="timer"></span><span class="sc" id="score"></span></div>
<div class="wrap" id="app"></div>
<script>
// ── 개인 과제 공통: 번호별 문제 만들기 + 채점 (학생용 · 강사용이 같은 코드를 씀) ──
const HW_NAME = 'JSON 꺼내기 개인 과제 v1';
const THEMES = [
  { t: '제주 체험 공방 (연습용 가상 목록)', items: [['도자기 공방', 1], ['귤따기 농장', 0], ['승마 체험장', 0], ['향수 만들기 공방', 1], ['카약 체험장', 0], ['초콜릿 공방', 1], ['감귤 쿠키 교실', 1], ['오름 걷기 교실', 0], ['해녀 체험장', 0], ['천연 염색 공방', 1]] },
  { t: '제주 먹거리 가게 (연습용 가상 목록)', items: [['귤 주스 가게', 1], ['바닷가 테라스 카페', 0], ['흑돼지 식당', 1], ['해변 푸드트럭', 0], ['동네 빵집', 1], ['고기국수집', 1], ['아이스크림 노점', 0], ['전통 찻집', 1], ['야시장 꼬치 가게', 0], ['보말 칼국수집', 1]] },
  { t: '제주 볼거리 (연습용 가상 목록)', items: [['그림 전시관', 1], ['해안 산책로', 0], ['별 관측 언덕', 0], ['작은 수족관', 1], ['민속 전시관', 1], ['풍차 언덕', 0], ['꽃 정원', 0], ['책 박물관', 1], ['등대 전망대', 0], ['장난감 박물관', 1]] },
];
const AREAS = ['동쪽', '서쪽', '서귀포', '제주시'];
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(a, r) { for (let i = a.length - 1; i > 0; i--) { const j = r() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
const cnt = (items, f) => items.filter(f).length;

function makeHW(no) {
  no = Math.max(1, Math.min(99, no | 0));
  const r = rng(no * 7919 + 13), th = THEMES[(no - 1) % THEMES.length];
  const n = 7 + (r() * 3 | 0);                                   // 7 ~ 9 곳
  let items, A, A2, S, tries = 0;
  do {
    items = shuffle(th.items.slice(), r).slice(0, n).map(([name, ind]) => ({ name, area: AREAS[r() * 4 | 0], indoor: !!ind, star: 1 + (r() * 5 | 0) }));
    const byA = AREAS.map(a => [a, cnt(items, s => s.area === a)]).sort((x, y) => y[1] - x[1] || (r() - .5));
    A = byA[0][0]; A2 = (byA.find(([a, c]) => a !== A && c >= 1) || [null])[0];
    S = r() < .5 ? 3 : 4;
    tries++;
  } while ((cnt(items, s => s.area === A) < 2 || !A2 || cnt(items, s => s.star >= S) < 1 || cnt(items, s => s.star >= S) === n ||
            cnt(items, s => s.indoor) < 1 || cnt(items, s => !s.indoor) < 1) && tries < 50);
  const k = 2 + (r() * (n - 2) | 0);                              // 2 ~ n-1 번째
  let xi; do { xi = r() * (n - 1) | 0; } while (xi === k - 1);
  const ev = no % 3;                                              // 버튼 문제 3가지 모양
  const btn = ev === 0 ? { label: '비 오는 날', cond: 's.indoor === true', say: '실내(indoor 가 true)인 곳 이름' }
            : ev === 1 ? { label: '맑은 날', cond: 's.indoor === false', say: '야외(indoor 가 false)인 곳 이름' }
            : { label: A2 + ' 보기', cond: `s.area === '${A2}'`, say: `지역이 ${A2} 인 곳 이름` };
  const data = { 과제번호: no, 주제: th.t, items };
  // 숨은 시험 데이터: 같은 모양 · 다른 값 (값을 직접 적은 답은 여기서 걸러짐)
  const r2 = rng(no * 104729 + 7);
  const hidden = { 과제번호: no, 주제: th.t, items: items.slice(0, n - 1).map(s => ({ name: s.name, area: AREAS[r2() * 4 | 0], indoor: r2() < .5, star: 1 + (r2() * 5 | 0) })) };
  const Q = [
    { no: 1, pt: 10, type: 'expr', q: `<b>${k}번째</b> 항목의 이름(name)을 꺼내세요. (0부터 세는 것 주의!)`, ans: `data.items[${k - 1}].name` },
    { no: 2, pt: 5, type: 'expr', q: `항목이 <b>모두 몇 개</b>인지 꺼내세요.`, ans: `data.items.length` },
    { no: 3, pt: 10, type: 'expr', q: `<b>${items[xi].name}</b> 의 별점(star)을 꺼내세요. 숫자를 직접 쓰지 말고 주소로!`, ans: `data.items[${xi}].star` },
    { no: 4, pt: 15, type: 'code', q: `반복문으로 모든 항목을 <b>“이름 · 지역”</b> 모양으로 한 줄씩 보여 주세요. (예: ${items[0].name} · ${items[0].area})`, ans: "for (const s of data.items) {\n  show(s.name + ' · ' + s.area)\n}" },
    { no: 5, pt: 20, type: 'code', q: `지역(area)이 <b>${A}</b> 인 곳의 이름만 보여 주세요.`, ans: `for (const s of data.items) {\n  if (s.area === '${A}') show(s.name)\n}` },
    { no: 6, pt: 20, type: 'code', q: `별점(star)이 <b>${S} 이상</b>인 곳이 몇 개인지 세어서 숫자 하나만 보여 주세요.`, ans: `let n = 0\nfor (const s of data.items) {\n  if (s.star >= ${S}) n = n + 1\n}\nshow(n)` },
    { no: 7, pt: 20, type: 'event', q: `<b>“${btn.label}”</b> 버튼을 만들고, 누르면 ${btn.say}이 모두 보이게 하세요. 만든 뒤 미니 화면에서 직접 눌러 보세요.`, ans: `button('${btn.label}', () => {\n  for (const s of data.items) {\n    if (${btn.cond}) show(s.name)\n  }\n})`, need: [btn.label] },
  ];
  return { no, data, hidden, Q, params: { n, k, x: items[xi].name, A, S, btn: btn.label } };
}

// ── 실행기: Worker (끝나지 않는 반복은 1.5초에 멈춤), 안 되면 바로 실행 ──
const WSRC = `
let BTN = {}, OUT = [];
const fmt = v => typeof v === 'string' ? v : (v === undefined ? 'undefined' : JSON.stringify(v));
const show = (...a) => { if (OUT.length < 500) OUT.push(a.map(fmt).join(' ')); };
const button = (label, fn) => { BTN[String(label)] = fn; };
onmessage = e => {
  const m = e.data;
  if (m.click != null) { OUT = []; let err = null; try { BTN[m.click] && BTN[m.click](); } catch (er) { err = String(er && er.message || er); } postMessage({ id: m.id, out: OUT, err }); return; }
  BTN = {}; OUT = [];
  try {
    const f = new Function('data', 'show', 'button', m.mode === 'expr' ? 'return (' + m.code + '\\n)' : m.code);
    const v = f(m.data, show, button);
    let value; if (m.mode === 'expr') value = v === undefined ? { __undef: 1 } : JSON.parse(JSON.stringify(v));
    let sims = null;
    if (m.sim) sims = m.sim.map(l => { OUT = []; const has = !!BTN[l]; let err = null; try { has && BTN[l](); } catch (er) { err = String(er.message); } return { l, has, out: OUT.slice(), err }; });
    postMessage({ id: m.id, ok: true, value, out: m.sim ? [] : OUT, buttons: Object.keys(BTN), sims });
  } catch (er) { postMessage({ id: m.id, ok: false, err: String(er && er.message || er) }); }
};`;
let wURL = null; try { wURL = URL.createObjectURL(new Blob([WSRC], { type: 'text/javascript' })); } catch (e) {}
function makeWorker() { try { return new Worker(wURL); } catch (e) { return null; } }
let seq = 0;
function runIn(w, msg) {
  return new Promise(res => {
    if (!w) return res(inlineRun(msg));
    const id = ++seq; let done = false;
    const t = setTimeout(() => { if (!done) { done = true; w.terminate(); res({ ok: false, err: '__TIMEOUT', dead: true }); } }, 1500);
    w.onmessage = e => { if (e.data.id !== id || done) return; done = true; clearTimeout(t); res(e.data); };
    w.onerror = e => { if (done) return; done = true; clearTimeout(t); e.preventDefault && e.preventDefault(); res({ ok: false, err: e.message || '문법 오류' }); };
    w.postMessage(Object.assign({ id }, msg));
  });
}
let IB = {}, IO = [];
function inlineRun(m) {
  const fmt = v => typeof v === 'string' ? v : (v === undefined ? 'undefined' : JSON.stringify(v));
  const show = (...a) => { if (IO.length < 500) IO.push(a.map(fmt).join(' ')); };
  const button = (l, fn) => { IB[String(l)] = fn; };
  if (m.click != null) { IO = []; let err = null; try { IB[m.click] && IB[m.click](); } catch (er) { err = String(er.message); } return { out: IO, err }; }
  IB = {}; IO = [];
  try {
    const f = new Function('data', 'show', 'button', m.mode === 'expr' ? 'return (' + m.code + '\n)' : m.code);
    const v = f(JSON.parse(JSON.stringify(m.data)), show, button);
    let value; if (m.mode === 'expr') value = v === undefined ? { __undef: 1 } : JSON.parse(JSON.stringify(v));
    const saved = IB; let sims = null;
    if (m.sim) sims = m.sim.map(l => { IO = []; const has = !!saved[l]; let err = null; try { has && saved[l](); } catch (er) { err = String(er.message); } return { l, has, out: IO.slice(), err }; });
    return { ok: true, value, out: m.sim ? [] : IO, buttons: Object.keys(IB), sims };
  } catch (er) { return { ok: false, err: String(er.message) }; }
}
const norm = a => JSON.stringify((a || []).map(x => String(x).replace(/\s+/g, '')));
const sameVal = (a, b) => JSON.stringify(a) === JSON.stringify(b);
async function once(code, mode, data, sim) { const w = makeWorker(); const r = await runIn(w, { code, mode, data, sim }); if (w) w.terminate(); return r; }
// 한 문제 채점: 원래 데이터 + 숨은 데이터 둘 다 맞아야 통과
async function gradeQ(hw, q, code) {
  if (!code || !code.trim()) return { pass: false, why: '빈 답' };
  const mode = q.type === 'expr' ? 'expr' : 'code', sim = q.type === 'event' ? q.need : undefined;
  const res = [];
  for (const d of [hw.data, hw.hidden]) {
    const [mine, exp] = [await once(code, mode, d, sim), await once(q.ans, mode, d, sim)];
    if (!mine.ok) return { pass: false, why: mine.err, err: mine.err, first: res[0] };
    let ok;
    if (mode === 'expr') ok = sameVal(mine.value, exp.value);
    else if (sim) ok = q.need.every(l => { const a = mine.sims.find(s => s.l === l), b = exp.sims.find(s => s.l === l); return a && a.has && norm(a.out) === norm(b.out); });
    else ok = norm(mine.out) === norm(exp.out);
    res.push({ ok, mine, exp });
  }
  const pass = res[0].ok && res[1].ok;
  return { pass, firstOk: res[0].ok, hardcoded: res[0].ok && !res[1].ok, mine: res[0].mine, exp: res[0].exp };
}
function friendly(err) {
  if (!err) return '';
  if (err === '__TIMEOUT') return '반복이 끝나지 않아요(1.5초에서 멈췄어요) — 반복 조건을 확인하세요.';
  let m;
  if ((m = err.match(/Cannot read propert(?:y|ies) of (undefined|null) \(reading '([^']*)'\)/))) return `없는 서랍 안에서 '${m[2]}' 를 꺼내려고 했어요 — 앞부분 주소(철자 · 번호)부터 확인하세요.`;
  if ((m = err.match(/^(\S+) is not defined/))) return `'${m[1]}' 라는 이름을 몰라요 — data 로 시작했나요? 글자라면 따옴표 ' ' 를 씌웠나요?`;
  if (/is not a function/.test(err)) return '함수가 아닌 것을 ( ) 로 불렀어요 — 철자를 확인하세요.';
  if (/Unexpected|missing \) |Invalid or unexpected/.test(err)) return '문법 모양이 어긋났어요 — 괄호 ( ) { } [ ] 와 따옴표 짝을 확인하세요.';
  if (/Assignment to constant/.test(err)) return 'const 상자에는 다시 넣을 수 없어요 — let 으로.';
  return '오류: ' + err;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const KEY = 'json-hw-v1';
let S = null; try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
let HW = null, results = {};
const app = document.getElementById('app');
const two = n => String(n).padStart(2, '0');
const stamp = t => { const d = new Date(t); return `${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())} ${two(d.getHours())}:${two(d.getMinutes())}:${two(d.getSeconds())}`; };

function drawStart() {
  app.innerHTML = `<div class="card start"><h2>과제 받기</h2>
   <div class="note">강사님이 알려 준 <b>수강번호</b>와 이름을 넣으세요. 번호에 따라 나만의 데이터가 만들어져요.</div>
   <label class="f" for="no">수강번호 (1 ~ 99)</label><input class="t" id="no" type="number" min="1" max="99" inputmode="numeric">
   <label class="f" for="nm">이름</label><input class="t" id="nm" autocomplete="off" maxlength="20">
   <ul class="rules"><li>문제 7개 · 100점 · 30~40분</li><li>각 문제의 <b>채점</b> 버튼으로 바로 확인 — 몇 번이든 다시 해도 돼요</li>
   <li>숫자나 이름을 직접 적지 말고 <b>data 에서 꺼내기</b> — 직접 적은 답은 숨은 시험에서 틀려요</li>
   <li>다 끝나면 맨 아래 <b>제출 파일 만들기</b> → 받은 파일을 강사님이 알려 준 곳에 제출</li></ul>
   <div class="row" style="margin-top:14px"><button class="go" id="startB">과제 시작</button></div><div class="note" id="msg"></div></div>`;
  document.getElementById('startB').onclick = () => {
    const no = +document.getElementById('no').value, nm = document.getElementById('nm').value.trim();
    if (!(no >= 1 && no <= 99)) return document.getElementById('msg').textContent = '수강번호를 1 ~ 99 사이로 넣어 주세요.';
    if (!nm) return document.getElementById('msg').textContent = '이름을 넣어 주세요.';
    S = { no, nm, t0: Date.now(), code: {}, pass: {} }; save(); drawHW();
  };
}

// ── 서랍장 ──
const isId = k => /^[A-Za-z_$가-힣][\w$가-힣]*$/.test(k);
const pk = (p, k) => isId(k) ? p + '.' + k : p + '[' + JSON.stringify(k) + ']';
let OPEN = new Set(['data', 'data.items']);
function leaf(v) { return typeof v === 'string' ? `<span class="s">"${esc(v)}"</span>` : typeof v === 'number' ? `<span class="n">${v}</span>` : `<span class="b">${v}</span>`; }
function node(label, v, p) {
  if (v && typeof v === 'object') {
    const o = OPEN.has(p);
    const kids = Array.isArray(v) ? v.map((x, i) => node(`<span class="ix">[${i}]</span>`, x, p + '[' + i + ']')) : Object.keys(v).map(k => node(`<span class="k">${esc(k)}</span>`, v[k], pk(p, k)));
    const pv = Array.isArray(v) ? `[ ${v.length}칸 ]` : `{ ${Object.keys(v).length}개 }` + (v.name ? ' ' + esc(v.name) : '');
    return `<li><span class="tg" data-p="${esc(p)}">${o ? '▼' : '▶'}</span>${label} <span class="pv">${o ? '' : pv}</span>${o ? '<ul>' + kids.join('') + '</ul>' : ''}</li>`;
  }
  return `<li><span class="tg"></span>${label} : <span class="v" data-p="${esc(p)}">${leaf(v)}</span></li>`;
}
function drawTree() {
  const d = HW.data;
  document.getElementById('tree').innerHTML = '<ul>' + Object.keys(d).map(k => node(`<span class="k">${esc(k)}</span>`, d[k], pk('data', k))).join('') + '</ul>';
}

function drawHW() {
  HW = makeHW(S.no);
  document.getElementById('bar').style.display = 'flex';
  document.getElementById('who').textContent = `수강번호 ${S.no} · ${S.nm}`;
  app.innerHTML = `<div class="grid"><div class="side card"><h2>내 서랍장 — data</h2>
     <div class="note">주제: <b>${esc(HW.data.주제)}</b> · ▶ 로 열고 값을 누르면 주소가 나와요.</div>
     <div class="tree" id="tree"></div><div class="addr" id="addr"><span class="lab">주소 — 값을 하나 눌러 보세요</span></div>
     <div class="cheat">기억나나요? 점 <code>.이름표</code> · 번호 <code>[0]</code> · 칸 수 <code>.length</code> · 반복 <code>for (const s of data.items) { }</code> · 조건 <code>if (s.area === '동쪽')</code> · 보여 주기 <code>show(값)</code> · 버튼 <code>button('이름', () => { })</code></div></div>
   <div class="qs"><h2>문제 7개 · 100점</h2><div class="note">한 줄 문제는 Enter, 여러 줄은 Ctrl + Enter 로도 채점돼요. 입력한 답은 자동 저장돼요.</div><div id="qs"></div>
   <div class="card submit"><h2>제출하기</h2><div class="note">다 못 풀어도 제출할 수 있어요. 제출 파일에는 수강번호 · 이름 · 시간 · 내 답이 들어가고, 강사님이 다시 채점해요.</div>
   <div class="row"><button class="go" id="subB">제출 파일 만들기</button><button class="ghost" id="copyB">제출 내용 복사</button><button class="ghost" id="resetB">처음부터(다른 번호)</button></div>
   <div class="done" id="done"></div></div></div></div>`;
  drawTree();
  document.getElementById('tree').onclick = e => {
    const tg = e.target.closest('.tg'), v = e.target.closest('.v');
    if (tg && tg.dataset.p) { const p = tg.dataset.p; OPEN.has(p) ? OPEN.delete(p) : OPEN.add(p); drawTree(); }
    if (v) { const p = v.dataset.p; let val; try { val = new Function('data', 'return ' + p)(HW.data); } catch (er) {}
      document.getElementById('addr').innerHTML = `<span class="lab">이 자리의 주소</span><br><span class="p">${esc(p)}</span> → ${esc(JSON.stringify(val))}`; }
  };
  const qs = document.getElementById('qs');
  qs.innerHTML = HW.Q.map(q => `<div class="q" id="q${q.no}"><div class="hd"><span class="no">${q.no}</span><span>${q.q}</span><span class="pt">${q.pt}점</span></div>
     ${q.type === 'expr' ? `<input class="expr" id="in${q.no}" spellcheck="false" autocomplete="off" placeholder="data.">` : `<textarea id="in${q.no}" spellcheck="false" placeholder="${q.type === 'event' ? "button('…', () => {\n  \n})" : 'for (const s of data.items) {\n  \n}'}"></textarea>`}
     <div class="row"><button class="go" data-g="${q.no}">채점</button></div>
     ${q.type === 'event' ? `<div class="screen" id="scr${q.no}"><div class="sb">미니 화면 — 버튼을 눌러 보세요</div><div class="btns" id="bt${q.no}"></div><div class="out" id="so${q.no}"></div></div>` : ''}
     <div class="res" id="r${q.no}"></div></div>`).join('');
  HW.Q.forEach(q => {
    const inp = document.getElementById('in' + q.no);
    inp.value = S.code[q.no] || '';
    inp.oninput = () => { S.code[q.no] = inp.value; save(); };
    inp.onkeydown = e => {
      if (q.type === 'expr' && e.key === 'Enter') { e.preventDefault(); grade(q); }
      if (q.type !== 'expr' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); grade(q); }
      if (q.type !== 'expr' && e.key === 'Tab') { e.preventDefault(); const s = inp.selectionStart; inp.setRangeText('  ', s, inp.selectionEnd, 'end'); }
    };
    if (S.pass[q.no]) document.getElementById('q' + q.no).classList.add('ok');
  });
  qs.querySelectorAll('[data-g]').forEach(b => b.onclick = () => grade(HW.Q[+b.dataset.g - 1]));
  document.getElementById('subB').onclick = () => submit(true);
  document.getElementById('copyB').onclick = () => submit(false);
  document.getElementById('resetB').onclick = () => { if (confirmReset()) { S = null; save(); location.reload(); } };
  score(); tick();
}
let resetArm = 0;
function confirmReset() { const b = document.getElementById('resetB'); if (Date.now() - resetArm < 4000) return true; resetArm = Date.now(); b.textContent = '한 번 더 누르면 지워져요'; setTimeout(() => b.textContent = '처음부터(다른 번호)', 4000); return false; }
function score() { const s = HW.Q.reduce((a, q) => a + (S.pass[q.no] ? q.pt : 0), 0); document.getElementById('score').textContent = `${s} / 100점`; return s; }
function tick() { const m = Math.floor((Date.now() - S.t0) / 60000); document.getElementById('timer').textContent = `⏱ ${m}분째`; }
setInterval(() => { if (S && HW) tick(); }, 20000);
const play = {};
async function grade(q) {
  const code = document.getElementById('in' + q.no).value, r = document.getElementById('r' + q.no), box = document.getElementById('q' + q.no);
  S.code[q.no] = code; save();
  r.className = 'res on'; r.innerHTML = '채점 중…';
  const g = await gradeQ(HW, q, code);
  S.pass[q.no] = g.pass ? 1 : 0; save(); score(); box.classList.toggle('ok', g.pass);
  const outTxt = g.mine ? (q.type === 'expr' ? (g.mine.value && g.mine.value.__undef ? 'undefined  ← 그런 서랍이 없어요' : JSON.stringify(g.mine.value, null, 1)) : (g.mine.out.join('\n') || '')) : '';
  if (g.pass) r.className = 'res on ok', r.innerHTML = `<b class="t">✓ 정답! (+${q.pt}점)</b>${outTxt ? `<pre>${esc(outTxt)}</pre>` : ''}`;
  else if (g.err) r.className = 'res on bad', r.innerHTML = `<b class="t">✗ ${esc(friendly(g.err))}</b>`;
  else if (g.why === '빈 답') r.className = 'res on bad', r.innerHTML = '<b class="t">✗ 답을 먼저 써 주세요.</b>';
  else if (g.hardcoded) r.className = 'res on bad', r.innerHTML = '<b class="t">✗ 지금 데이터에선 맞지만, 숨은 시험에서 틀렸어요.</b>값(숫자 · 이름)을 직접 적지 말고 data 에서 꺼내거나 반복 · 조건으로 구해 주세요.';
  else r.className = 'res on bad', r.innerHTML = `<b class="t">✗ 아직 아니에요.</b>${q.type === 'expr' ? '내가 꺼낸 값:' : '내 결과:'}<pre>${esc(outTxt || '(아무것도 안 보여 줬어요)')}</pre>`;
  if (q.type === 'event') {                       // 미니 화면: 직접 눌러 보기
    if (play[q.no]) play[q.no].terminate();
    const w = play[q.no] = makeWorker();
    const res = await runIn(w, { code, mode: 'code', data: HW.data });
    const scr = document.getElementById('scr' + q.no), bt = document.getElementById('bt' + q.no), so = document.getElementById('so' + q.no);
    scr.classList.add('on');
    if (!res.ok) { bt.innerHTML = ''; so.innerHTML = ''; return; }
    bt.innerHTML = res.buttons.map(l => `<button data-l="${esc(l)}">${esc(l)}</button>`).join('') || '<span class="empty">버튼이 없어요 — button(…) 을 썼나요?</span>';
    so.innerHTML = '<div class="empty">버튼을 눌러 보세요</div>';
    bt.querySelectorAll('button').forEach(b => b.onclick = async () => {
      const c = await runIn(w, { click: b.dataset.l });
      so.innerHTML = c.out && c.out.length ? c.out.map(x => `<div>${esc(x)}</div>`).join('') : '<div class="empty">아무것도 안 보여요</div>';
    });
  }
}
async function submit(asFile) {
  // 제출 직전 모든 문제 다시 채점
  for (const q of HW.Q) { const g = await gradeQ(HW, q, S.code[q.no] || ''); S.pass[q.no] = g.pass ? 1 : 0; document.getElementById('q' + q.no).classList.toggle('ok', g.pass); }
  save(); const sc = score();
  const t1 = Date.now();
  const body = { 과제: HW_NAME, 수강번호: S.no, 이름: S.nm, 시작: stamp(S.t0), 제출: stamp(t1), 걸린시간_분: Math.round((t1 - S.t0) / 60000), 자체점수: sc,
    문제별: HW.Q.map(q => ({ 번호: q.no, 통과: !!S.pass[q.no] })), 답: Object.fromEntries(HW.Q.map(q => [q.no, S.code[q.no] || ''])) };
  const txt = JSON.stringify(body, null, 2);
  const done = document.getElementById('done');
  const fname = `json_hw_${two(S.no)}.txt`;
  let how = '';
  if (asFile) {
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain;charset=utf-8' })); a.download = fname; document.body.appendChild(a); a.click(); a.remove(); how = `파일 <b>${esc(fname)}</b> 을 받았어요 (다운로드 폴더). 이 파일을 제출하세요.`; }
    catch (e) { how = '파일을 만들지 못했어요 — “제출 내용 복사”를 눌러 붙여 넣어 제출하세요.'; }
  } else {
    try { await navigator.clipboard.writeText(txt); how = '제출 내용을 복사했어요 — 강사님이 알려 준 곳에 붙여 넣으세요.'; }
    catch (e) { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); how = '제출 내용을 복사했어요 — 붙여 넣어 제출하세요.'; } catch (er) { how = '복사가 안 돼요 — 제출 파일을 만들어 주세요.'; } t.remove(); }
  }
  done.className = 'done on';
  done.innerHTML = `<div class="big">${sc} / 100점</div><div>수강번호 ${S.no} · ${esc(S.nm)} · 제출 ${stamp(t1)} · ${body.걸린시간_분}분</div><div style="margin-top:8px">${how}</div><div class="note" style="margin-top:6px">이 화면을 캡처해 두면 제출 확인용으로 좋아요. 고쳐서 다시 제출해도 돼요(마지막 파일로 채점).</div>`;
}
if (S && S.no) drawHW(); else drawStart();
</script>
