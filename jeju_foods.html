            :root { --bg:#0f2a4d; --card:#221e2b; --text:#f3eefa; --sub:#a9a1b8; --line:#352f42; --accent:#b39dff; --sea:#4fd1dd; }
        }
        * { box-sizing: border-box; }
        body { margin:0; background:var(--bg); color:var(--text); font-family:"Malgun Gothic",sans-serif; }
        header { padding:48px 16px 28px; text-align:center; background:linear-gradient(120deg,#e4dcff,#cdbfff 50%,#b39dff); color:#2e1065; }
        header h1 { margin:0 0 8px; font-size:clamp(26px,5vw,40px); }
        header p { margin:0; opacity:.92; }
        main { max-width:1300px; margin:0 auto; padding:20px 16px 48px; }
        #wish { background:var(--card); border:1px solid var(--line); border-left:5px solid #fbbf24; border-radius:12px; padding:14px 18px; margin-bottom:22px; }
        #wish h3 { margin:0 0 8px; font-size:17px; }
        #wish ul { margin:0; padding:0; list-style:none; display:grid; gap:6px; }
        #wish li { display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:14px; }
        #wish li b { font-size:15px; }
        #wish li span { color:var(--sub); }
        #search { display:block; width:100%; max-width:760px; padding:10px 18px; margin:0 auto 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:15px; }
        #chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
        .chip { padding:6px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; font-size:14px; }
        .chip.on { background:var(--accent); color:#2e1065; border-color:var(--accent); }
        #count { color:var(--sub); font-size:14px; margin-bottom:12px; }
        #grid { display:grid; grid-template-columns:repeat(3,1fr); gap:28px 22px; }
        @media (max-width:640px) { #grid { grid-template-columns:repeat(2,1fr); } }
        @media (max-width:420px) { #grid { grid-template-columns:1fr; } }
        /* 육각형: 그림자는 clip-path 에 잘리므로 바깥 .cell 에 drop-shadow 를 준다 */
        .cell { filter:drop-shadow(0 4px 8px rgba(0,0,0,.13)); transition:transform .15s; width:100%; max-width:340px; margin:0 auto; cursor:pointer; user-select:none; }
        .cell:hover { transform:translateY(-4px) scale(1.02); }
        .card { --c:var(--accent); --hex:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
                aspect-ratio:1 / 1.1547; padding:4px; background:#8b5cf6; clip-path:var(--hex); }
        .card.pick { background:#5b21b6; }
        .in { width:100%; height:100%; background:#f3edff; clip-path:var(--hex); padding:20% 15% 16%;
              display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; text-align:center; }
        .top { display:flex; align-items:center; gap:6px; }
        .cat { font-size:11px; padding:2px 9px; border-radius:999px; background:color-mix(in srgb,var(--c) 16%,transparent); color:var(--c); font-weight:bold; }
        .pickmark { font-size:11px; color:var(--c); font-weight:bold; }
        .card h2 { margin:0; font-size:clamp(14px,1.4vw,18px); }
        .card p { margin:0; color:var(--sub); font-size:clamp(11px,1vw,12.5px); line-height:1.4; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
        .stars { font-size:17px; letter-spacing:1px; color:var(--line); line-height:1; }
        .stars b { color:#fbbf24; font-weight:normal; }
        .score { font-size:11px; color:var(--sub); }
        .score a { color:var(--sea); margin-left:6px; }
        @media (prefers-color-scheme: dark) { .in { background:#2d2150; } }    </style>

                      "name":  "한라봉에이드",
                      "category":  "음료·주류",
                      "description":  "한라봉 과육을 넣은 에이드",
                      "score":  60,
                      "selected":  false,
                      "source":  ""
                  },
                  {
                      "name":  "귤피차",
                      "category":  "음료·주류",
                      "description":  "감귤 껍질로 우려낸 차",
                      "score":  40,
                      "selected":  false,
                      "source":  ""
                  },
                  {
                      "name":  "감귤초콜릿",
                      "category":  "디저트",
                      "description":  "감귤 풍미를 더한 초콜릿 기념품",
                      "score":  65,
                      "selected":  false,
                      "source":  ""
                  },
                  {
                      "name":  "우도땅콩아이스크림",
                      "category":  "디저트",
                      "description":  "우도땅콩을 올린 아이스크림",
                      "score":  70,
                      "selected":  false,
                      "source":  ""
                  },
                  {
                      "name":  "녹차아이스크림",
                      "category":  "디저트",
                      "description":  "제주 녹차를 넣은 아이스크림",
                      "score":  65,
                      "selected":  false,
                      "source":  ""
                  }
              ]
}

        sub.textContent = data.region

        // 카테고리별 대표 색 (귤, 동백, 숲, 바다, 한라봉)
        const COLOR = { "음식":"#ff7a1a", "전통 간식":"#e8548c", "특산물":"#2e9e5f", "음료·주류":"#5b6cf0", "디저트":"#c9812a" }

        // 평가는 1~5점: 기존 score(0~100)를 20으로 나눠 반올림 (최소 1점)
        const rating = i => Math.min(5, Math.max(1, Math.round(i.score / 20)))

        // selected 가 true 인 항목만 모아 "가 보고 싶은 곳" 목록으로 보여준다
        // 카드를 누르면 담고/빼고, 고른 목록은 브라우저(localStorage)에 기억한다 (막혀 있으면 기억 없이 동작)
        const KEY = "jeju_foods_selected"
        try {
            const saved = JSON.parse(localStorage.getItem(KEY))
            if (Array.isArray(saved)) data.items.forEach(i => i.selected = saved.includes(i.name))
        } catch (e) {}
        const save = () => {
            try { localStorage.setItem(KEY, JSON.stringify(data.items.filter(i => i.selected).map(i => i.name))) } catch (e) {}
        }

        const renderWish = () => {
            const picks = data.items.filter(i => i.selected)
            wish.innerHTML = `<h3>📍 가 보고 싶은 곳 (${picks.length})</h3>` + (picks.length
                ? `<ul>${picks.map(i => `<li><b>${i.name}</b><span>${i.category}</span><span>${"★".repeat(rating(i))}${"☆".repeat(5 - rating(i))}</span><span>${i.description}</span></li>`).join("")}</ul>`
                : `<span style="color:var(--sub)">카드를 눌러 가 보고 싶은 곳을 담아 보세요.</span>`)
        }

        const cats = ["전체", ...new Set(data.items.map(i => i.category))]
        let cur = "전체"

        const render = () => {
            const q = search.value.trim()
            // 카테고리 + 이름 검색으로 거른 뒤, score 높은 순으로 정렬 (같으면 원래 순서 유지)
            const list = data.items
                .filter(i => (cur === "전체" || i.category === cur) && (i.name.includes(q) || i.description.includes(q)))
                .sort((a, b) => b.score - a.score)
            count.textContent = list.length + "개"
            grid.innerHTML = list.map(i => `
                <div class="cell" data-name="${i.name}"><article class="card ${i.selected ? "pick" : ""}" style="--c:${COLOR[i.category] || "#ff7a1a"}"><div class="in">
                    <div class="top"><span class="cat">${i.category}</span>${i.selected ? '<span class="pickmark">💛 담음</span>' : ""}</div>
                    <h2>${i.name}</h2>
                    <p>${i.description}</p>
                    <div class="stars" title="평가 ${rating(i)}점"><b>${"★".repeat(rating(i))}</b>${"★".repeat(5 - rating(i))}</div>
                    <div class="score"><span>평가 ${rating(i)} / 5</span>${i.source ? `<a href="${i.source}" target="_blank">출처</a>` : ""}</div>
                </div></article></div>`).join("")
        }

        chips.innerHTML = cats.map(c => `<button class="chip ${c === cur ? "on" : ""}">${c}</button>`).join("")
        chips.onclick = e => {
            if (!e.target.classList.contains("chip")) return
            cur = e.target.textContent
            chips.querySelectorAll(".chip").forEach(b => b.classList.toggle("on", b.textContent === cur))
            render()
        }
        grid.onclick = e => {
            const cell = e.target.closest(".cell")
            if (!cell) return
            const item = data.items.find(i => i.name === cell.dataset.name)
            item.selected = !item.selected
            save(); renderWish(); render()
        }
        search.oninput = render
        renderWish()
        render()
    </script>
</body>
</html>
